org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.io.tmpdir=C:/dsh-ws/.build/tmp
android.useAndroidX=true
kotlin.code.style=official
# 真机测试结束后不卸载 App:卸载会丢失无线调试配对(钥匙存在 App 里)和无障碍授权,每次都得重新配对
android.injected.androidTest.leaveApksInstalledAfterRun=true

# 本地构建：AGP 8.7.3 官方上限是 compileSdk 35，这里用 36 做本地验证
android.suppressUnsupportedCompileSdk=36
android.overridePathCheck=true

kotlin.daemon.jvmargs=-Xmx2g -Djava.io.tmpdir=C:/dsh-ws/.build/tmp
